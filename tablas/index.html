<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Primeras tablas</title>
    <style>
        td, th, tr, table{
            border: 1px solid black;
            margin-bottom: 10px;
            padding: 5px;
        }
    </style>
  </head>
  <body>

    <h1>Mis primeras tablas</h1>

<!-- Table row -->
    <table>
      <tr>
        <th>Posicion</th>
        <th>Nombre</th>
        <th>Nota</th>
      </tr>
      <tr>
        <td rowspan="2">1º</td>
        <td>Laura Gomez</td>
        <td>9,2</td>
      </tr>
      <tr>
        <td>Iván Martinez</td>
        <td>9,2</td>
      </tr>
    </table>
<!-- Table Column -->
    <table>
      <tr>
        <th>1</th>
        <th>2</th>
        <th>3</th>
      </tr>
      <tr>
        <td>4</td>
        <td colspan="2">5 6</td>
      </tr>
      <tr>
        <td>7</td>
        <td>8</td>
        <td>9</td>
      </tr>
    </table>
<!-- Table Row Y column -->
    <table>
      <tr>
        <th>1</th>
        <th colspan="2">2</th>
      </tr>
      <tr>
        <td>3</td>
        <td>4</td>
        <td>5</td>
      </tr>
      <tr>
        <td rowspan="2">6</td>
        <td>7</td>
        <td>8</td>
      </tr>
      <tr>
        <td>9</td>
        <td>10</td>
      </tr>
    </table>

    <table>
        <tr>
            <th></th>
            <th>
                <table style="border: 0;">
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </table>
            </th>
        </tr>
        <tr>
            <td></td>
            <td></td>
        </tr>
    </table>

  </body>
</html>
