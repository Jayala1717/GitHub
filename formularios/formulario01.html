<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style></style>
  </head>
  <body>
    <h2>Formulario 1</h2>

    <form action="" name="">
      <fieldset>
        <legend>Completar</legend>
        <label for="color">Elija un color: </label>
        <input type="color" name="" id="color" />
        <br />
        <textarea
          name="texto"
          id=""
          placeholder="Por favor, escriba aquí"
          rows="5"
          cols="53"
        ></textarea>
        <br />
        <select name="lenguaje" id="">
          <option value="java">Java</option>
          <option value="python">Python</option>
          <option value="html">HTML</option>
          <option value="visual_basic">Visual Basic</option>
        </select>
        <br />
        <input type="checkbox" name="ciclo" value="ciclosasir" id="" />Asir
        <input type="checkbox" name="ciclo" value="ciclodam" id="" />DAM
        <input type="checkbox" name="ciclo" value="ciclodaw" id="" />DAW
      </fieldset>

      <fieldset>
        <legend>Rellene las opciones siguientes</legend>
        <label for="fecha">Elija una fecha</label>
        <input type="date" name="fecha" id="" />
        <br />
        <label for="fichero">Elija un fichero</label>
        <input type="file" name="fichero" id="" />
        <br />
        <select name="ciclo" id="" multiple>
          <option value="smir">SMIR</option>
          <option value="ASIR">Asir</option>
          <option value="DAW">DAW</option>
        </select>
      </fieldset>
    </form>

    <!-- formulario 2 -->

    <form action="">

        <legend>Rellenar</legend>
        <input
          type="radio"

        />Lengua
        <br />
        <input
          type="radio"
          name="asignatura"

        />Matematicas
        <br />
        <input
          type="radio"
          name="asignatura"
          id=""
          value="asignaturahistoria"
        />Historia
        <br />
        <input
          type="radio"
          name="asignatura"
          id=""
          value="asignaturageografia"
        />Geografia
        <br />
        <br />
        <input
          type="checkbox"
          name="ciclo"
          value="editornotepad"
          id=""
        />Notepad
        <input type="checkbox" name="ciclo" value="editoremacs" id="" />Emacs
        <input type="checkbox" name="ciclo" value="editorotro" id="" />Otro
        <br />
        <textarea
          name=""
          id=""
          rows="5"
          cols="59"
          placeholder="Escriba aquí, por favor"
        ></textarea>
        <br />
        <select name="procesador" id="">
          <option value="amd">AMD</option>
          <option value="intel_i5">Intel i5</option>
          <option value="intel_i7">Intel i7</option>
        </select>
      </fieldset>
    </form>

    <!-- Formulario 3 -->
    <h2>Formulario 3</h2>

    <form action="">
      <fieldset>
        <legend>Rellenar</legend>
        <input
          type="radio"
          name="asignatura"
          id=""
          value="asignaturageografia"
        />Geografia
        <input
          type="radio"
          name="asignatura"
          id=""
          value="asignaturalengua"
        />Lengua
        <input
          type="radio"
          name="asignatura"
          id=""
          value="asignaturamatematicas"
        />Matematicas
        <input
          type="radio"
          name="asignatura"
          id=""
          value="asignaturahistoria"
        />Historia
        <br />
        <label for="hora">Elije una hora</label>
        <input type="time" name="hora" id="" />

        <input type="checkbox" name="idioma" value="idiomaespanol" id="" />
        <br>
        <input type="checkbox" name="idioma" value="idiomaingles" id="" />
        <br>
        <input type="checkbox" name="idioma" value="idiomaaleman" id="" />
        <br>
        <input type="checkbox" name="idioma" value="idiomafrances" id="" />
        <br>

        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" id="">
        <br>
        <label for="apellidos">Apellidos</label>
        <input type="text" name="apellidos" id="">

      </fieldset>
    </form>
  </body>
</html>
