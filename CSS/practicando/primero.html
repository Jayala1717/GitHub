<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos CSS</title>
    <style>
        .parrafo-azul{
            color: blue;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-weight: bold;
        }
        .parrafo-verde{
            color: rgb(20, 200, 20);
            font-family: 'Courier New', Courier, monospace;
        }
        .parrafo-verde:hover{
            font-weight: bold;
        }
        
        .parrafo-amarillo{
            color: #FFFF00;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>
    <h1 class="parrafo-azul">Estilos CSS</h1>
    <p class="parrafo-azul">Esto va de color azul</p>
    <p class="parrafo-amarillo">Esto va de color amarillo</p>
    <p class="parrafo-verde">Esto va de color varde</p>

    <p style="border: 2px dotted red; padding: 50px;">Primer Bloque</p>
    <p style="border: 2px dashed green; padding-top: 30px;">Segundo Bloque</p>
</body>
</html>
